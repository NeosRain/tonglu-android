[package]
name = "campus-localsend-bridge"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[lib]
name = "campus_localsend"
crate-type = ["cdylib"]

[dependencies]
localsend = { path = "vendor/core", features = ["full"] }
jni = "0.21.1"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
tokio-stream = "0.1"
futures-util = "0.3"
uuid = { version = "1", features = ["v4"] }
libc = "0.2"
tracing = "0.1"
tracing-subscriber = "0.3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[workspace]
